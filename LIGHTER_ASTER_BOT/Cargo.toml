[package]
name = "lighter_aster_bot"
version = "0.1.0"
edition = "2021"
# Keep the supported compiler aligned with the container and release checks.
rust-version = "1.92"
default-run = "lighter_aster_bot"
description = "Aster/Lighter bot: XEMM maker/hedger, taker-taker arbitrage and research tools"

[lib]
name = "lighter_aster_bot"
path = "src/lib.rs"

[[bin]]
name = "lighter_aster_bot"
path = "src/main.rs"

[features]
# `hotpath` is the lock-free real-time substrate (latest-book cell, stream
# watchdog, execution seam) used by the `livebot`; the `taker` engine needs it too. It is default-on
# but `record`/`replay` never touch it, so the deterministic core builds and runs
# bit-identically under `--no-default-features`.
default = ["hotpath"]
hotpath = [
    "dep:arc-swap",
    "dep:tokio-util",
    # Core pinning for ingest/strategy threads — tail-latency determinism for live trading.
    "dep:core_affinity",
    # --- live-trading cryptographic signing (Aster EIP-712) ---
    # Only the live `livebot` workers need these; the deterministic record/replay core
    # never signs, so they stay optional and `--no-default-features` pulls in none of them.
    "dep:k256",
    "dep:tiny-keccak",
    "dep:hex",
    "dep:fs2",
    "dep:memmap2",
]
# Core pinning is now always enabled with `hotpath` (which includes `core_affinity`).
# This alias is kept for backward compatibility with any `--features core-pin` invocations.
core-pin = ["hotpath"]

[dependencies]
arrayvec = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
# Unknown-key rejection for file-loaded configs (bot.toml); recorded run headers stay lenient.
serde_ignored = "0.1"
rust_decimal = { version = "1", features = ["serde-str"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Streaming compression for the run log. Cold-path (record/replay) only, so it is a
# core dep (not behind `hotpath`); the deterministic core still builds under
# `--no-default-features`. zstd-sys compiles via `cc`, already required by rusqlite's
# `bundled` feature, so this adds no new toolchain dependency.
zstd = "0.13"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
fast-float = "0.2"
libc = "0.2"
libloading = "0.8"
# --- hotpath (optional, lock-free real-time substrate) ---
arc-swap = { version = "1", optional = true }
tokio-util = { version = "0.7", optional = true }
core_affinity = { version = "0.8", optional = true }
# --- live signing (optional, pulled in by `hotpath`) ---
# secp256k1 ECDSA with recoverable signatures (EIP-712 'v'); keccak256; hex for r/s
# serialization; fs2 + memmap2 for the cross-process Aster nonce counter.
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
tiny-keccak = { version = "2", features = ["keccak"], optional = true }
hex = { version = "0.4", optional = true }
fs2 = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
# test-util enables tokio::test(start_paused) for deterministic timer tests on the
# hedge fill-wait path.
tokio = { version = "1", features = ["full", "test-util"] }

# NOTE: no `panic = "abort"` here: livebot/run.rs relies on catch_unwind to report a
# strategy-thread panic through the supervision channel and shut down through the
# order-cancelling cleanup path. Abort would skip that. The `taker` subcommand keeps its
# abort-on-panic behaviour through a panic hook instead (`taker::abort_on_panic`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
